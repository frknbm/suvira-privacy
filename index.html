const data={
tr:["Gizlilik Politikası","Son güncelleme: 20 Kasım 2026","Suvira – Nature & Relaxing Sounds uygulamasını kullandığınız için teşekkür ederiz. Suvira'yı kullanmak için hesap oluşturmanız gerekmez. Bu politika, uygulamayı kullanırken bilgilerin nasıl işlenebileceğini açıklar.",[
["1. Uygulama verileri","Favoriler, ses karışımları, dinleme geçmişi, zamanlayıcı, dil, tema ve bildirim tercihleri gibi bilgiler uygulama özelliklerini sunmak için cihazınızda saklanabilir. Uygulama verilerini silmeniz veya uygulamayı kaldırmanız yerel verileri silebilir."],
["2. Reklamlar ve Google AdMob","Suvira ücretsiz sürümünde Google AdMob reklamları gösterebilir. AdMob; IP adresi, cihaz veya reklam tanımlayıcıları, uygulama ve reklam etkileşimleri ile tanılama bilgileri gibi verileri reklam sunumu, ölçümü, güvenlik ve sahtekârlığın önlenmesi amaçlarıyla işleyebilir. İşlenen veriler cihazınıza, bölgenize, izinlerinize ve Google hizmetlerinin yapılandırmasına bağlıdır. [Google iş ortakları politikası](https://policies.google.com/technologies/partner-sites) ve [Google Gizlilik Politikası](https://policies.google.com/privacy)."],
["3. Bildirimler ve izinler","Uygulama, seçtiğiniz rahatlama veya uyku hatırlatmaları için cihazın bildirim özelliğini kullanabilir. Bildirim izinlerini cihaz ayarlarından yönetebilirsiniz. Uygulama sesleri arka planda çalmak için işletim sistemi özelliklerini kullanabilir."],
["4. Kullanım amaçları","Bilgiler uygulama özelliklerini çalıştırmak, tercihlerinizi hatırlamak, bildirimleri yönetmek, reklamları sunmak ve ölçmek, güvenliği sağlamak ve performansı geliştirmek için kullanılabilir."],
["5. Üçüncü taraflar","Google AdMob gibi üçüncü taraf hizmetler verileri kendi gizlilik politikalarına göre işleyebilir. Lütfen [Google Gizlilik Politikası'nı](https://policies.google.com/privacy) inceleyin."],
["6. Güvenlik ve saklama","Bilgileri korumak için makul önlemler alınır. Cihazda saklanan tercihler uygulama verileri silindiğinde veya uygulama kaldırıldığında kaybolabilir. Üçüncü tarafların saklama uygulamaları kendi politikalarına tabidir."],
["7. Çocukların gizliliği","Suvira özellikle çocuklara yönelik tasarlanmamıştır ve çocuklardan bilerek kişisel bilgi toplamayı amaçlamaz."],
["8. Haklarınız ve değişiklikler","Bulunduğunuz yerdeki veri koruma mevzuatı kapsamında haklarınız olabilir. Desteklenen bölgelerde reklam ve gizlilik tercihlerinizi Google izin mesajından yönetebilirsiniz. Bu politika güncellenebilir; güncel sürüm bu sayfada yayımlanır."]]],
en:["Privacy Policy","Last updated: November 20, 2026","Thank you for using Suvira – Nature & Relaxing Sounds. You do not need to create an account to use Suvira. This policy explains how information may be handled when you use the app.",[
["1. App data","The app may store favorites, sound mixes, listening history, timer settings, language, theme and notification preferences on your device to provide app features. Clearing app data or uninstalling the app may delete locally stored data."],
["2. Advertising and Google AdMob","The free version may display ads through Google AdMob. AdMob may process information such as IP address, device or advertising identifiers, app and ad interactions, and diagnostics to deliver and measure ads, maintain security and prevent fraud. Data processed depends on your device, region, choices and Google's service configuration. See Google's [Partners policy](https://policies.google.com/technologies/partner-sites) and [Privacy Policy](https://policies.google.com/privacy)."],
["3. Notifications and permissions","The app may use your device's notification feature for relaxation or sleep reminders you choose. You can manage notification permissions in device settings. The app may use operating-system features for background audio playback."],
["4. Purposes","Information may be used to operate app features, remember preferences, manage notifications, deliver and measure ads, maintain security and improve performance."],
["5. Third parties","Third-party services such as Google AdMob may process data under their own privacy policies. Please review [Google's Privacy Policy](https://policies.google.com/privacy)."],
["6. Security and retention","Reasonable measures are used to help protect information. Device-stored preferences may be deleted when app data is cleared or the app is uninstalled. Third-party retention is governed by their own policies."],
["7. Children's privacy","Suvira is not specifically designed for children and we do not intend to knowingly collect personal information from children."],
["8. Your rights and changes","You may have rights under applicable data protection laws. In supported regions, you can manage advertising and privacy choices through Google's consent message. This policy may be updated; the current version will be posted here."]]],
de:["Datenschutzerklärung","Zuletzt aktualisiert: 20. November 2026","Vielen Dank für die Nutzung von Suvira – Nature & Relaxing Sounds. Für die Nutzung ist kein Konto erforderlich. Diese Erklärung beschreibt, wie Informationen bei der Nutzung verarbeitet werden können.",[
["1. App-Daten","Die App kann Favoriten, Klangmischungen, Hörverlauf, Timer-, Sprach-, Design- und Benachrichtigungseinstellungen lokal speichern. Beim Löschen der App-Daten oder Deinstallieren können diese Daten verloren gehen."],
["2. Werbung und Google AdMob","Die kostenlose Version kann Werbung über Google AdMob anzeigen. AdMob kann IP-Adresse, Geräte- oder Werbekennungen, App- und Werbeinteraktionen sowie Diagnosedaten zur Auslieferung und Messung von Werbung, Sicherheit und Betrugsprävention verarbeiten. Details hängen von Gerät, Region, Einstellungen und Google-Konfiguration ab. Siehe [Google-Partner-Richtlinie](https://policies.google.com/technologies/partner-sites) und [Datenschutzerklärung](https://policies.google.com/privacy)."],
["3. Benachrichtigungen und Berechtigungen","Die App kann die Benachrichtigungsfunktion für ausgewählte Entspannungs- oder Schlaferinnerungen verwenden. Berechtigungen verwalten Sie in den Geräteeinstellungen. Hintergrundwiedergabe kann Betriebssystemfunktionen nutzen."],
["4. Zwecke","Informationen dienen dem Betrieb der App, dem Speichern von Einstellungen, der Verwaltung von Benachrichtigungen, Werbung, Sicherheit und Leistungsverbesserung."],
["5. Drittanbieter","Dienste wie Google AdMob verarbeiten Daten gemäß ihren eigenen Datenschutzbestimmungen. Bitte lesen Sie die [Google-Datenschutzerklärung](https://policies.google.com/privacy)."],
["6. Sicherheit und Speicherung","Es werden angemessene Schutzmaßnahmen eingesetzt. Lokal gespeicherte Einstellungen können beim Löschen der App-Daten oder bei der Deinstallation verloren gehen. Für Drittanbieter gelten deren Richtlinien."],
["7. Datenschutz von Kindern","Suvira richtet sich nicht speziell an Kinder. Wir beabsichtigen nicht, wissentlich personenbezogene Daten von Kindern zu erheben."],
["8. Rechte und Änderungen","Nach geltendem Datenschutzrecht können Ihnen Rechte zustehen. In unterstützten Regionen verwalten Sie Werbe- und Datenschutzeinstellungen über die Google-Einwilligungsnachricht. Diese Erklärung kann aktualisiert werden."]]],
fr:["Politique de confidentialité","Dernière mise à jour : 20 novembre 2026","Merci d'utiliser Suvira – Nature & Relaxing Sounds. Aucun compte n'est nécessaire. Cette politique explique comment les informations peuvent être traitées lors de l'utilisation de l'application.",[
["1. Données de l'application","L'application peut stocker localement les favoris, mixages, historique d'écoute, minuteur et préférences de langue, thème et notifications. L'effacement des données ou la désinstallation peut supprimer ces données."],
["2. Publicités et Google AdMob","La version gratuite peut afficher des annonces via Google AdMob. AdMob peut traiter l'adresse IP, les identifiants de l'appareil ou publicitaires, les interactions avec l'application et les annonces ainsi que des diagnostics pour diffuser et mesurer les annonces, assurer la sécurité et prévenir la fraude. Cela dépend de l'appareil, de la région, des choix et de la configuration Google. Consultez la [politique des partenaires](https://policies.google.com/technologies/partner-sites) et la [politique de confidentialité](https://policies.google.com/privacy) de Google."],
["3. Notifications et autorisations","L'application peut utiliser les notifications pour les rappels de détente ou de sommeil choisis. Gérez les autorisations dans les paramètres de l'appareil. La lecture en arrière-plan peut utiliser les fonctions du système."],
["4. Utilisation","Les informations peuvent servir au fonctionnement, à la mémorisation des préférences, aux notifications, à la publicité, à la sécurité et à l'amélioration des performances."],
["5. Tiers","Des services comme Google AdMob peuvent traiter des données selon leurs propres politiques. Consultez la [politique de confidentialité de Google](https://policies.google.com/privacy)."],
["6. Sécurité et conservation","Des mesures raisonnables protègent les informations. Les préférences locales peuvent être supprimées en effaçant les données ou en désinstallant l'application. Les règles des tiers s'appliquent à leurs données."],
["7. Enfants","Suvira n'est pas spécialement conçue pour les enfants et nous ne cherchons pas à collecter sciemment leurs données personnelles."],
["8. Droits et modifications","Les lois applicables peuvent vous accorder des droits. Dans les régions prises en charge, gérez vos choix via le message de consentement Google. Cette politique peut être mise à jour."]]],
es:["Política de privacidad","Última actualización: 20 de noviembre de 2026","Gracias por utilizar Suvira – Nature & Relaxing Sounds. No necesita crear una cuenta. Esta política explica cómo puede tratarse la información al utilizar la aplicación.",[
["1. Datos de la aplicación","La aplicación puede guardar localmente favoritos, mezclas, historial de escucha, temporizador y preferencias de idioma, tema y notificaciones. Borrar los datos o desinstalar la aplicación puede eliminar esta información."],
["2. Anuncios y Google AdMob","La versión gratuita puede mostrar anuncios mediante Google AdMob. AdMob puede tratar la dirección IP, identificadores del dispositivo o publicitarios, interacciones con la aplicación y los anuncios y datos de diagnóstico para mostrar y medir anuncios, mantener la seguridad y prevenir fraudes. Depende del dispositivo, región, elecciones y configuración de Google. Consulte la [política para partners](https://policies.google.com/technologies/partner-sites) y la [Política de Privacidad](https://policies.google.com/privacy) de Google."],
["3. Notificaciones y permisos","La aplicación puede usar notificaciones para los recordatorios de relajación o sueño que elija. Gestione los permisos en los ajustes del dispositivo. La reproducción en segundo plano puede utilizar funciones del sistema."],
["4. Finalidades","La información puede utilizarse para ejecutar funciones, recordar preferencias, gestionar notificaciones, publicidad, seguridad y mejorar el rendimiento."],
["5. Terceros","Servicios como Google AdMob pueden tratar datos conforme a sus propias políticas. Consulte la [Política de Privacidad de Google](https://policies.google.com/privacy)."],
["6. Seguridad y conservación","Se aplican medidas razonables de protección. Las preferencias locales pueden borrarse al eliminar los datos o desinstalar la aplicación. La conservación por terceros se rige por sus políticas."],
["7. Menores","Suvira no está diseñada específicamente para niños y no pretendemos recopilar deliberadamente sus datos personales."],
["8. Derechos y cambios","Puede tener derechos conforme a las leyes aplicables. En regiones compatibles, gestione sus opciones mediante el mensaje de consentimiento de Google. Esta política puede actualizarse."]]],
it:["Informativa sulla privacy","Ultimo aggiornamento: 20 novembre 2026","Grazie per utilizzare Suvira – Nature & Relaxing Sounds. Non è necessario creare un account. Questa informativa spiega come possono essere trattate le informazioni durante l'utilizzo dell'app.",[
["1. Dati dell'app","L'app può memorizzare localmente preferiti, mix, cronologia di ascolto, timer e preferenze di lingua, tema e notifiche. Cancellare i dati o disinstallare l'app può eliminare queste informazioni."],
["2. Pubblicità e Google AdMob","La versione gratuita può mostrare annunci tramite Google AdMob. AdMob può trattare indirizzo IP, identificatori del dispositivo o pubblicitari, interazioni con app e annunci e dati diagnostici per fornire e misurare annunci, garantire la sicurezza e prevenire frodi. Dipende da dispositivo, regione, scelte e configurazione Google. Consulta la [normativa per i partner](https://policies.google.com/technologies/partner-sites) e le [Norme sulla privacy](https://policies.google.com/privacy) di Google."],
["3. Notifiche e autorizzazioni","L'app può usare le notifiche per i promemoria di relax o sonno scelti. Gestisci le autorizzazioni nelle impostazioni del dispositivo. La riproduzione in background può usare funzioni del sistema."],
["4. Finalità","Le informazioni possono essere usate per le funzioni dell'app, ricordare preferenze, gestire notifiche, pubblicità, sicurezza e migliorare le prestazioni."],
["5. Terze parti","Servizi come Google AdMob possono trattare dati secondo le proprie informative. Consulta le [Norme sulla privacy di Google](https://policies.google.com/privacy)."],
["6. Sicurezza e conservazione","Adottiamo misure ragionevoli per proteggere le informazioni. Le preferenze locali possono essere eliminate cancellando i dati o disinstallando l'app. La conservazione da parte di terzi segue le loro informative."],
["7. Minori","Suvira non è progettata specificamente per i bambini e non intendiamo raccogliere consapevolmente i loro dati personali."],
["8. Diritti e modifiche","Potresti avere diritti ai sensi delle leggi applicabili. Nelle regioni supportate puoi gestire le scelte tramite il messaggio di consenso Google. Questa informativa può essere aggiornata."]]],
zh:["隐私政策","最后更新：2026年11月20日","感谢您使用 Suvira – Nature & Relaxing Sounds。使用本应用无需创建账户。本政策说明使用应用时信息可能如何被处理。",[
["1. 应用数据","应用可能在设备本地保存收藏、声音混音、收听历史、计时器以及语言、主题和通知偏好。清除应用数据或卸载应用可能会删除这些信息。"],
["2. 广告与 Google AdMob","免费版本可能通过 Google AdMob 展示广告。AdMob 可能处理 IP 地址、设备或广告标识符、应用和广告互动及诊断信息，以投放和衡量广告、维护安全并防止欺诈。具体取决于设备、地区、选择和 Google 服务配置。请参阅 [Google 合作伙伴政策](https://policies.google.com/technologies/partner-sites)和[隐私政策](https://policies.google.com/privacy)。"],
["3. 通知与权限","应用可能使用系统通知发送您选择的放松或睡眠提醒。您可以在设备设置中管理权限。后台播放可能使用操作系统功能。"],
["4. 使用目的","信息可能用于运行应用功能、记住偏好、管理通知、广告、安全和性能改进。"],
["5. 第三方","Google AdMob 等第三方可能根据自身隐私政策处理数据。请查看 [Google 隐私政策](https://policies.google.com/privacy)。"],
["6. 安全与保存","我们采取合理措施保护信息。本地偏好可能在清除应用数据或卸载应用时被删除。第三方保存数据遵循其自身政策。"],
["7. 儿童隐私","Suvira 并非专门为儿童设计，我们无意在知情情况下收集儿童个人信息。"],
["8. 您的权利与政策变更","您可能享有适用数据保护法律规定的权利。在支持的地区，可通过 Google 同意提示管理选择。本政策可能更新。"]]],
ru:["Политика конфиденциальности","Последнее обновление: 20 ноября 2026 г.","Спасибо за использование Suvira – Nature & Relaxing Sounds. Для использования приложения аккаунт не требуется. Политика объясняет, как может обрабатываться информация.",[
["1. Данные приложения","Приложение может локально хранить избранное, миксы, историю прослушивания, настройки таймера, языка, темы и уведомлений. Очистка данных или удаление приложения может удалить эту информацию."],
["2. Реклама и Google AdMob","Бесплатная версия может показывать рекламу через Google AdMob. AdMob может обрабатывать IP-адрес, идентификаторы устройства или рекламы, взаимодействия с приложением и рекламой, а также диагностику для показа и измерения рекламы, безопасности и предотвращения мошенничества. Это зависит от устройства, региона, настроек и конфигурации Google. См. [правила для партнёров](https://policies.google.com/technologies/partner-sites) и [Политику конфиденциальности Google](https://policies.google.com/privacy)."],
["3. Уведомления и разрешения","Приложение может использовать уведомления для выбранных напоминаний об отдыхе или сне. Разрешениями можно управлять в настройках устройства. Фоновое воспроизведение может использовать функции ОС."],
["4. Цели использования","Информация может использоваться для работы функций, сохранения настроек, уведомлений, рекламы, безопасности и улучшения производительности."],
["5. Третьи стороны","Сервисы, такие как Google AdMob, могут обрабатывать данные по собственным политикам. См. [Политику конфиденциальности Google](https://policies.google.com/privacy)."],
["6. Безопасность и хранение","Применяются разумные меры защиты. Локальные настройки могут быть удалены при очистке данных или удалении приложения. Сроки хранения третьими сторонами определяются их политиками."],
["7. Дети","Suvira не предназначено специально для детей; мы не намерены сознательно собирать персональные данные детей."],
["8. Права и изменения","У вас могут быть права по применимым законам. В поддерживаемых регионах настройки можно изменить через сообщение Google о согласии. Политика может обновляться."]]],
uk:["Політика конфіденційності","Останнє оновлення: 20 листопада 2026 року","Дякуємо, що користуєтеся Suvira – Nature & Relaxing Sounds. Для використання застосунку обліковий запис не потрібен. Політика пояснює, як може оброблятися інформація.",[
["1. Дані застосунку","Застосунок може локально зберігати обране, мікси, історію прослуховування, налаштування таймера, мови, теми та сповіщень. Очищення даних або видалення застосунку може видалити цю інформацію."],
["2. Реклама та Google AdMob","Безкоштовна версія може показувати рекламу через Google AdMob. AdMob може обробляти IP-адресу, ідентифікатори пристрою або реклами, взаємодії із застосунком і рекламою та діагностичні дані для показу й вимірювання реклами, безпеки та запобігання шахрайству. Це залежить від пристрою, регіону, налаштувань і конфігурації Google. Див. [політику для партнерів](https://policies.google.com/technologies/partner-sites) та [Політику конфіденційності Google](https://policies.google.com/privacy)."],
["3. Сповіщення та дозволи","Застосунок може використовувати сповіщення для вибраних нагадувань про відпочинок або сон. Дозволами можна керувати в налаштуваннях пристрою. Фонове відтворення може використовувати функції ОС."],
["4. Мета використання","Інформація може використовуватися для роботи функцій, збереження налаштувань, сповіщень, реклами, безпеки та покращення продуктивності."],
["5. Треті сторони","Сервіси, як-от Google AdMob, можуть обробляти дані відповідно до власних політик. Див. [Політику конфіденційності Google](https://policies.google.com/privacy)."],
["6. Безпека та зберігання","Застосовуються розумні заходи захисту. Локальні налаштування можуть бути видалені після очищення даних або видалення застосунку. Строки зберігання третіми сторонами визначаються їхніми політиками."],
["7. Діти","Suvira не розроблено спеціально для дітей; ми не маємо наміру свідомо збирати персональні дані дітей."],
["8. Права та зміни","Ви можете мати права згідно із застосовним законодавством. У підтримуваних регіонах налаштування можна змінити через повідомлення Google про згоду. Політика може оновлюватися."]]}
};
